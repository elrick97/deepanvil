<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2a1d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deepanvil" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Deepanvil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <script>
      // Phones have no devtools: show any startup failure on screen.
      function showForgeError(msg) {
        var el = document.getElementById('forge-error') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'forge-error' }));
        el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9;white-space:pre-wrap;font:12px/1.4 monospace;color:#ffd9c9;background:rgba(80,20,10,.85);padding:10px;border-radius:10px;max-height:40vh;overflow:auto';
        el.textContent += String(msg) + '\n';
      }
      addEventListener('error', function (e) { showForgeError(e.message + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '')); });
      addEventListener('unhandledrejection', function (e) { showForgeError('Unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    </script>
    <canvas id="world"></canvas>
    <div id="slates"></div>
    <div id="bubbles"></div>
    <div id="hud"></div>
    <div id="card" hidden></div>
    <div id="dock">
      <div id="blueprint" hidden></div>
      <div id="clarify" hidden></div>
      <div id="quest" class="quest hud-card hidden"></div>
      <div id="controls"></div>
      <div id="offerings"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
