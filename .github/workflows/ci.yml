# Keeps main green the same way Odin does: typecheck, build, and the zero-token
# orchestration self-test (real git + real gates, stub agents — no Claude account needed).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Orchestration self-test (zero tokens)
        run: node apps/server/src/agents/selftest.ts
